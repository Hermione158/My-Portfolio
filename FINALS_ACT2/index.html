<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <style>
        body {
            text-align: center;
            margin-top: 80px;
            font-family: 'Poppins', sans-serif;
        }

        button{
            background-color: blue;
            color: white;
            border: none;
            outline: none;
            padding: 10px 0;
            border-radius: 12px;
            width: 20%;
            cursor: pointer;
            transition: 0.8s;
            text-align: center;
            margin-top: 15px;
            box-shadow: 2px 2px 2px rgb(92, 89, 89);
        }

        button:hover{
            transform: rotate(360deg);
        }

        #message{
            font-size: 25px;
            font-weight: bold;
        }

        img{
            position: relative;
            width: 15%;
            height: 40%;
            border-radius: 50%;
            text-align: center;
            margin-top: -30px;

        }
    </style>

<body>

    <img src="logo.png" alt=""><br>

    <button id="firstBtn">First Button</button>
    <button id="secButton">Second Button</button>

    <p id="message">Waiting...</p>

    <p id="profile">Profile</p>
    <p id="grade">Grades</p>
    <p id="sched">Schedule</p>
    
    <script src="node.js"></script>
</body>
</html>
